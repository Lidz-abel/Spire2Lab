  <path d="M123 217V200L91 176M123 200L157 175L156 158" stroke="url(#route)" stroke-width="3" stroke-linejoin="round"/>
  <g fill="#101D29" stroke="#78DED9" stroke-width="2.5">
    <circle cx="123" cy="211" r="4.5"/>
    <circle cx="91" cy="176" r="4.5"/>
    <circle cx="157" cy="175" r="4.5"/>
  </g>
